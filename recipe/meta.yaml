{% set name = "mc3" %}
{% set version = "3.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/mc3-{{ version }}.tar.gz
  sha256: 2684354603239a8ca84808909185a2ed45a6a40d8893759adb1b177153448b0e

build:
  number: 1
  skip: true  # [win]
  skip: true  # [py<39]
  entry_points:
    - mc3 = mc3.__main__:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - numpy >=2.0.0
    - pip
    - python
    - setuptools
  run:
    - matplotlib-base >=3.8.0
    - numpy >=2.0.0
    - python
    - scipy >=1.5.4

test:
  imports:
    - mc3

about:
  home: https://github.com/pcubillos/mc3
  summary: Multi-core Markov-chain Monte Carlo package.
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/pcubillos/mc3
  doc_url: https://mc3.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - pcubillos
